<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocktheke</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #e8c97e;
      --accent2: #c9a84c;
      --text: #f0ece2;
      --muted: #888;
      --danger: #e07070;
      --star: #e8c97e;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--accent); letter-spacing: 0.5px; }
    .cart-btn {
      position: relative; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 50px; padding: 8px 16px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .cart-badge {
      background: var(--accent); color: #000; font-size: 11px; font-weight: 700;
      border-radius: 50%; width: 18px; height: 18px;
      display: none; align-items: center; justify-content: center;
    }
    .cart-badge.show { display: flex; }

    /* PRODUCT GRID (tall tiles, 2 per row, equal height) */
    .products { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }

    .product-tile {
      position: relative;
      background: linear-gradient(145deg, var(--surface2), var(--surface));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 11px 12px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; cursor: pointer;
      animation: fadeUp 0.4s ease both;
      transition: transform 0.15s, border-color 0.15s;
    }
    .product-tile:active { transform: scale(0.97); border-color: var(--accent); }
    .product-tile.sold-out {
      position: relative; cursor: default; overflow: hidden;
    }
    .product-tile.sold-out:active { transform: none; border-color: var(--border); }
    .sold-inner {
      filter: blur(5px) grayscale(0.3); opacity: 0.55; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%;
    }
    .sold-stamp {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) rotate(-14deg);
      z-index: 5;
      border: 4px solid #c62828; border-radius: 6px;
      padding: 5px 14px; white-space: nowrap;
      /* rough, weathered edges via SVG turbulence displacement */
      filter: url(#grunge);
      background: transparent;
      opacity: 0.9;
    }
    .sold-stamp span {
      display: block;
      font-family: 'Arial Black', 'DM Sans', sans-serif;
      font-size: 24px; font-weight: 900; letter-spacing: 1px;
      color: #c62828; text-transform: uppercase;
      -webkit-text-stroke: 0.4px #c62828;
    }
    /* faded ink patches over the stamp for authenticity */
    .sold-stamp::after {
      content: ""; position: absolute; inset: -4px;
      background:
        radial-gradient(circle at 20% 30%, transparent 40%, rgba(15,15,15,0.55) 55%, transparent 60%),
        radial-gradient(circle at 70% 60%, transparent 35%, rgba(15,15,15,0.5) 50%, transparent 55%),
        radial-gradient(circle at 45% 80%, transparent 30%, rgba(15,15,15,0.45) 45%, transparent 50%);
      pointer-events: none; mix-blend-mode: multiply; border-radius: 6px;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .pt-emoji {
      font-size: 34px; line-height: 1; margin-bottom: 9px;
      width: 60px; height: 60px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pt-collage {
      width: 70px; height: 70px; border-radius: 12px; overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 2px; margin-bottom: 9px; border: 1px solid var(--border); flex-shrink: 0;
      background: var(--surface);
    }
    .pt-collage img { width: 100%; height: 100%; object-fit: cover; }
    .pt-collage-v3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 70px; height: 70px; }
    .pt-collage-v3 video { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: cover; object-position: center; pointer-events: none; background:#000; display:block; }
    .pt-collage-v3 .vid-wide { grid-column: 1 / -1; }
    .pt-name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 2px; letter-spacing:-0.2px; }
    .pt-strain { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.2; margin-bottom: 2px; }
    .pt-strain2 { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.25; margin-bottom: 7px; }
    .pt-desc { font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; flex: 1; }
    .pt-stars { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom: 8px; }
    .pt-stars .rt { color: var(--muted); font-size: 12px; font-weight:600; }
    .pt-from { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .badge-import {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      background: rgba(232,201,126,0.14); color: var(--accent);
      padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
    }
    .pt-import {
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid rgba(232,201,126,0.4);
      background: linear-gradient(145deg, rgba(232,201,126,0.10), rgba(0,0,0,0.22));
      box-shadow: 0 2px 12px rgba(232,201,126,0.14), inset 0 1px 0 rgba(255,255,255,0.06);
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .import-text {
      background-image: linear-gradient(90deg, #ff6b6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ff6b6b);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: farmRainbow 4s linear infinite;
    }
    .pt-arrow {
      position: absolute; top: 12px; right: 12px;
      color: var(--muted); font-size: 16px;
    }
    .pt-shine { margin: 1px 0 3px; }
    .shine-text {
      font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(110deg, #8a8a8a 0%, #cfcfcf 25%, #ffffff 50%, #cfcfcf 75%, #8a8a8a 100%);
      background-size: 220% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: silverShine 3s linear infinite;
      text-shadow: 0 0 1px rgba(255,255,255,0.1);
    }
    @keyframes silverShine {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    .pt-farm {
      margin-top: 10px;
      padding: 7px 16px;
      border-radius: 50px;
      border: 1px solid rgba(232,201,126,0.45);
      background: linear-gradient(145deg, rgba(232,201,126,0.12), rgba(0,0,0,0.25));
      box-shadow: 0 3px 14px rgba(232,201,126,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
      font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .pt-farm-text {
      background-image: linear-gradient(90deg, #ff6b6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ff6b6b);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: farmRainbow 4s linear infinite;
    }
    @keyframes farmRainbow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* FULL PRODUCT PAGE (overlay) */
    .product-page {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      overflow-y: auto;
      padding-bottom: 40px;
    }
    .product-page.open { transform: translateX(0); }
    .pp-header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(15,15,15,0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    }
    .pp-back-text {
      background: var(--surface2); border: 1px solid var(--border); color: var(--accent);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 8px 14px; border-radius: 50px; justify-self: start;
    }
    .pp-back-text:active { transform: scale(0.96); }
    .pp-htitle { font-size: 15px; font-weight: 700; color: var(--text); text-align: center; white-space: nowrap; }
    .pp-cart-btn {
      position: relative; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 50px; padding: 7px 12px; font-size: 16px; cursor: pointer;
      justify-self: end; display: flex; align-items: center;
    }
    .pp-cart-badge {
      background: var(--accent); color: #000; font-size: 10px; font-weight: 700;
      border-radius: 50%; min-width: 16px; height: 16px; padding: 0 4px;
      display: none; align-items: center; justify-content: center; margin-left: 4px;
    }
    .pp-cart-badge.show { display: inline-flex; }
    .pp-hero {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 28px 20px 20px;
    }
    .pp-emoji {
      width: 100px; height: 100px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; margin-bottom: 16px;
    }
    .pp-gallery {
      display: flex; gap: 10px; overflow-x: auto; width: 100%;
      scroll-snap-type: x mandatory; padding: 4px 0 8px; margin-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .pp-gallery::-webkit-scrollbar { height: 0; }
    .pp-gimg {
      width: 240px; height: 240px; object-fit: cover; border-radius: 16px;
      border: 1px solid var(--border); flex-shrink: 0; scroll-snap-align: center;
      background: #000; display: block;
    }
    .pp-gvid {
      height: 48vh; max-height: 420px; width: auto; max-width: 78vw;
      border-radius: 18px; border: 1px solid var(--border);
      flex-shrink: 0; scroll-snap-align: center;
      background: #000; display: block; object-fit: cover; cursor: pointer;
    }
    .pp-gvid::-webkit-media-controls { display: none !important; }
    .pp-gvid::-webkit-media-controls-enclosure { display: none !important; }
    .pp-gallery { padding-left: 5vw; padding-right: 5vw; gap: 14px; justify-content: flex-start; }
    .pp-gallery-hint { font-size: 14px; font-weight:600; color: var(--accent); margin-bottom: 16px; }
    .pp-name { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); margin-bottom: 6px; }
    .pp-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .pp-badges { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .pp-badges .pt-import, .pp-badges .pt-farm { margin-top: 0; }
    .pp-stars { display:inline-flex; align-items:center; gap:6px; }
    .pp-stars .rt { color: var(--muted); font-size: 13px; font-weight:600; }
    .pp-note { margin: 8px 16px 0; padding: 12px 14px; background: rgba(232,201,126,0.08); border:1px solid var(--border); border-radius:12px; font-size:13px; color:var(--accent); text-align:center; }
    .pp-flavors-text { padding: 4px 16px 12px; font-size:14px; line-height:1.9; color:var(--text); font-weight:500; }
    .rainbow-text {
      background: linear-gradient(180deg, #ff6b6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ff6b6b);
      background-size: 100% 300%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: rainbowFlow 8s linear infinite;
      font-weight: 600;
    }
    @keyframes rainbowFlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 300%; }
    }
    .pp-menge-toggle {
      margin: 10px 16px; padding: 16px 18px;
      background: linear-gradient(145deg, var(--surface2), var(--surface));
      border: 1px solid var(--accent); border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; font-weight: 700; color: var(--accent); cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .pp-menge-toggle:active { transform: scale(0.98); }
    .pp-menge-toggle.open { border-radius: 14px 14px 0 0; margin-bottom: 0; }
    .pp-menge-arrow { font-size: 14px; }

    .pp-variants { padding: 8px 16px 20px; }
    .pp-variants .variant-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .pp-vlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 4px 2px; }

    .variant {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 15px; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .variant:last-child { border-bottom: none; }
    .variant.req { background: rgba(232,201,126,0.04); }
    .v-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .v-qty { font-size: 16px; font-weight: 600; color: var(--text); }
    .v-price { font-size: 14px; font-weight: 600; color: var(--accent); }
    .v-price.req { color: var(--muted); font-style: italic; font-weight: 500; }
    .v-unit { font-size: 11px; color: var(--muted); font-weight: 400; }

    .v-add {
      background: var(--accent); color: #000; border: none; border-radius: 10px;
      padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 700; cursor: pointer; flex-shrink: 0; transition: transform 0.1s;
    }
    .v-add:active { transform: scale(0.9); }
    .v-stepper { display: none; align-items: center; gap: 12px; flex-shrink: 0; }
    .v-stepper.active { display: flex; }
    .v-sbtn {
      background: var(--surface2); border: 1px solid var(--accent); color: var(--accent);
      width: 30px; height: 30px; border-radius: 50%; font-size: 18px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .v-sbtn.plus { background: var(--accent); color: #000; border-color: var(--accent); }
    .v-snum { font-size: 15px; font-weight: 700; color: var(--accent); min-width: 20px; text-align: center; }

    /* CART DRAWER */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0; z-index: 401; padding: 20px 20px 40px;
      max-height: 85vh; overflow-y: auto;
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
    }
    .drawer.open { transform: translateY(0); }
    .drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
    .drawer-title { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 16px; color: var(--accent); }

    .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .cart-item-emoji { font-size: 26px; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 14px; font-weight: 500; }
    .cart-item-price { font-size: 13px; color: var(--accent); }
    .cart-item-price.req { color: var(--muted); font-style: italic; }
    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .qty-num { font-size: 13px; font-weight: 600; min-width: 26px; text-align: center; }

    .cart-total { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; font-size: 16px; font-weight: 600; }
    .total-amount { color: var(--accent); font-size: 20px; }
    .req-note { font-size: 12px; color: var(--muted); font-style: italic; margin: 4px 0 8px; }

    .note-section { margin: 10px 0 16px; }
    .note-section label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    .note-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; outline: none; }
    .note-input:focus { border-color: var(--accent); }

    .order-btn { width: 100%; background: var(--accent); color: #000; border: none; border-radius: 14px; padding: 16px; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 0.3px; }
    .order-btn:active { transform: scale(0.99); }

    .empty-cart { text-align: center; padding: 30px 0; color: var(--muted); font-size: 14px; }
    .empty-cart-icon { font-size: 40px; margin-bottom: 10px; }

    /* FLOATING CART BAR */
    #floatingCart {
      position: fixed; bottom: 20px; left: 16px; right: 16px;
      background: var(--accent); color: #000; border-radius: 16px; padding: 15px 20px;
      display: none; align-items: center; justify-content: space-between;
      font-weight: 700; font-size: 15px; cursor: pointer; z-index: 150;
      box-shadow: 0 8px 30px rgba(232,201,126,0.35);
      transform: translateY(120px); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    #floatingCart.show { display: flex; transform: translateY(0); }
    #floatingCart:active { transform: scale(0.98); }
    .fc-left { background: rgba(0,0,0,0.15); padding: 4px 12px; border-radius: 50px; font-size: 13px; }
    .fc-right { font-size: 16px; }

    /* LOCK SCREEN */
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
    .shake-error { animation: shake 0.4s ease !important; }
    #codeInput:focus { border-color: #e8c97e !important; box-shadow: 0 0 12px #e8c97e44; }
    #matrixCanvas { position: fixed; inset: 0; z-index: 600; display: none; background: #000; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <filter id="grunge">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="5" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- LOCK SCREEN -->
  <div id="lockScreen" style="position:fixed;inset:0;background:#0f0f0f;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;transition:opacity 0.6s ease;">
    <div id="lockIcon" style="font-size:56px;margin-bottom:20px;transition:all 0.3s;">🔒</div>
    <div style="font-family:'Playfair Display',serif;font-size:26px;color:#e8c97e;margin-bottom:8px;">Blocktheke</div>
    <div style="color:#888;font-size:13px;margin-bottom:32px;letter-spacing:1px;">ZUGANGSCODE EINGEBEN</div>
    <input id="codeInput" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="background:#1a1a1a;border:2px solid #2e2e2e;color:#e8c97e;border-radius:14px;padding:16px 20px;font-size:28px;text-align:center;letter-spacing:12px;width:170px;outline:none;margin-bottom:20px;font-family:'DM Sans',sans-serif;" />
    <button id="unlockBtn" style="background:#e8c97e;color:#000;border:none;border-radius:14px;padding:15px 40px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;">🔓 ENTSPERREN</button>
    <div id="lockError" style="color:#e07070;font-size:13px;margin-top:16px;display:none;"></div>
  </div>
  <canvas id="matrixCanvas"></canvas>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">✦ Blocktheke</div>
    <button class="cart-btn" onclick="openCart()">🛒 Warenkorb <span class="cart-badge" id="cartBadge">0</span></button>
  </div>

  <!-- PRODUCTS (grid of tiles) -->
  <div class="products" id="productList"></div>

  <!-- FULL PRODUCT PAGE (overlay) -->
  <div class="product-page" id="productPage">
    <div class="pp-header">
      <button class="pp-back-text" onclick="closeProduct()">Zurück</button>
      <div class="pp-htitle" id="ppTitle"></div>

  const CURRENCY = "CHF";
  // Swiss price format: whole numbers -> "50.–", with rappen -> "3.50"
  function fmtPrice(n) {
    if (Number.isInteger(n)) return n + ".\u2013";  // 50.–
    return n.toFixed(2);                              // 3.50
  }
  // Line total: for per-piece variants, price × pieces × qty; else price × qty
  function lineTotalOf(variant, qty) {
    if (variant.price === 0) return 0;
    const mult = variant.pieces ? variant.pieces : 1;
    return variant.price * mult * qty;
  }

  function startMatrixSequence() {
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = "block";
    const chars = "アイウエオカキクケコ0123456789ABCDEFXYZ$#@%&";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    let running = true;
    function draw() {
      if (!running) return;
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px monospace";
      for (let i=0;i<drops.length;i++){
        const ch = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    draw();
    setTimeout(() => { running = false; shatterScreen(canvas); }, 2000);
  }

  function shatterScreen(canvas) {
    const lockScreen = document.getElementById("lockScreen");
    const w = window.innerWidth, h = window.innerHeight;
    const snapshot = canvas.toDataURL();
    lockScreen.style.display = "none";
    const isMobile = w < 600;
    const cols = isMobile ? 5 : 8, rows = isMobile ? 9 : 13;
    const cellW = w/cols, cellH = h/rows;
    const container = document.createElement("div");
    container.style.cssText = "position:fixed;inset:0;z-index:700;pointer-events:none;overflow:hidden;";
    document.body.appendChild(container);
    const shards = [];
    for (let r=0;r<rows;r++){ for (let c=0;c<cols;c++){
      const s = document.createElement("div");
      s.style.cssText = `position:absolute;left:${c*cellW}px;top:${r*cellH}px;width:${cellW-4}px;height:${cellH-4}px;margin:2px;background-image:url(${snapshot});background-position:-${c*cellW}px -${r*cellH}px;background-size:${w}px ${h}px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.55),0 0 12px rgba(0,255,0,0.15),inset 0 0 8px rgba(0,255,0,0.1);transition:transform 2s cubic-bezier(0.25,0.1,0.25,1),opacity 2s ease;will-change:transform,opacity;`;
      container.appendChild(s);
      shards.push({el:s, cx:c*cellW+cellW/2, cy:r*cellH+cellH/2});
    }}
    canvas.style.display = "none";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const centerX=w/2, centerY=h/2;
      shards.forEach(s=>{
        const dx=s.cx-centerX, dy=s.cy-centerY;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const force=1.3+Math.random()*1.0;
        const x=(dx/dist)*dist*force+(Math.random()-0.5)*60;
        const y=(dy/dist)*dist*force+250+Math.random()*150;
        const rot=(Math.random()-0.5)*400;
        s.el.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(0.5)`;
        s.el.style.opacity="0";
      });
      setTimeout(()=>container.remove(),2100);
    }));
    setTimeout(()=>{
      const hdr=document.querySelector(".header-title");
      if(hdr){ hdr.style.transition="transform 0.5s cubic-bezier(0.34,1.56,0.64,1)"; hdr.style.transform="scale(1.15)"; setTimeout(()=>hdr.style.transform="scale(1)",500); }
    },400);
  }

  async function checkAccessCode() {
    const code = document.getElementById("codeInput").value.trim();
    const errorEl = document.getElementById("lockError");
    const btn = document.getElementById("unlockBtn");
    const lockIcon = document.getElementById("lockIcon");
    const input = document.getElementById("codeInput");
    if (code.length !== 4) {
      errorEl.textContent = "Bitte gib den 4-stelligen Code ein.";
      errorEl.style.display = "block";
      input.classList.remove("shake-error"); void input.offsetWidth; input.classList.add("shake-error");
      return;
    }
    btn.textContent = "Wird geprüft..."; btn.disabled = true;
    try {
      const res = await fetch(BOT_BACKEND_URL.replace("/order","/check-code"), {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code})
      });
      const data = await res.json();
      if (data.valid) {
        lockIcon.textContent = "🔓";
        input.style.borderColor = "#0f0"; input.style.boxShadow = "0 0 20px #0f06";
        btn.textContent = "ACCESS GRANTED"; btn.style.background = "#0f0"; btn.style.color = "#000"; btn.style.fontFamily = "monospace";
        startMatrixSequence();
      } else {
        btn.textContent = "🔓 ENTSPERREN"; btn.disabled = false;
        errorEl.textContent = "❌ Falscher Code! Frage den Shopinhaber nach dem heutigen Code.";
        errorEl.style.display = "block";
        input.style.borderColor = "#e07070"; input.value = "";
        input.classList.remove("shake-error"); void input.offsetWidth; input.classList.add("shake-error");
        lockIcon.textContent = "🔒";
        setTimeout(()=>{ input.style.borderColor = "#2e2e2e"; },1000);
      }
    } catch(e) {
      btn.textContent = "🔓 ENTSPERREN"; btn.disabled = false;
      errorEl.textContent = "⏳ Server wacht auf... Bitte warte 30 Sekunden und versuche es erneut!";
      errorEl.style.display = "block";
    }
  }

  // ═══ STAR RENDER (precise per-star partial fill via SVG) ═══
  function starRow(s, size) {
    size = size || 15;
    const starPath = "M12 2l2.9 6.26L21.5 9l-5 4.6 1.4 6.9L12 17.3 6.1 20.5l1.4-6.9-5-4.6 6.6-.74z";
    let defs = "", stars = "";
    for (let i=0;i<5;i++){
      // fill fraction for THIS star: full if s>=i+1, partial if between, empty otherwise
      let frac = Math.max(0, Math.min(1, s - i)); // e.g. s=4.2 -> star5 gets 0.2
      const pct = (frac*100).toFixed(1);
      const gid = "sg" + Math.random().toString(36).slice(2,8) + i;
      defs += `<linearGradient id="${gid}"><stop offset="${pct}%" stop-color="var(--star)"/><stop offset="${pct}%" stop-color="transparent"/></linearGradient>`;
      stars += `<path d="${starPath}" transform="translate(${i*22},0)" fill="url(#${gid})" stroke="var(--star)" stroke-width="1.2"/>`;
    }
    return `<svg viewBox="0 0 112 24" width="${(size*5.0).toFixed(0)}" height="${(size*1.05).toFixed(0)}" style="vertical-align:middle"><defs>${defs}</defs>${stars}</svg>`;
  }

  // ═══ RENDER PRODUCT TILES ═══
  const listEl = document.getElementById("productList");
  listEl.innerHTML = PRODUCTS.map(p => {
    const badge = p.import ? `<div class="pt-import">🇺🇸 <span class="import-text">USA Import</span></div>` : "";
    // lowest real price for "ab CHF X"
    const prices = p.variants.filter(v => v.price > 0).map(v => v.price);
    const fromVal = p.fromPrice || (prices.length ? Math.min(...prices) : 0);
    const fromHtml = fromVal ? `<div class="pt-from">ab ${CURRENCY} ${fmtPrice(fromVal)}</div>` : "";
    const bigLine = p.big ? `<div class="pt-strain">${p.big}</div>` : "";
    const big2Line = p.big2 ? `<div class="pt-strain2">${p.big2}</div>` : "";
    let emojiCell;
    if (p.videos && p.videos.length >= 3) {
      // frozen video preview collage (first frame, not playing)
      const wideFrame = p.wideFrame || 0.1;
      emojiCell = `<div class="pt-collage pt-collage-v3">
        <video src="${p.videos[0]}#t=0.1" muted playsinline preload="metadata"></video>
        <video src="${p.videos[1]}#t=0.1" muted playsinline preload="metadata"></video>
        <video src="${p.videos[2]}#t=${wideFrame}" class="vid-wide" muted playsinline preload="metadata"></video>
      </div>`;
    } else if (p.photos && p.photos.length >= 4) {
      emojiCell = `<div class="pt-collage">
        <img src="${p.photos[0]}" onerror="this.style.display='none'">
        <img src="${p.photos[1]}" onerror="this.style.display='none'">
        <img src="${p.photos[2]}" onerror="this.style.display='none'">
        <img src="${p.photos[3]}" onerror="this.style.display='none'">
      </div>`;
    } else {
      emojiCell = `<div class="pt-emoji">${p.emoji}</div>`;
    }
    const farmBadge = p.farm ? `<div class="pt-farm">💎 <span class="pt-farm-text">${p.farm}</span></div>` : "";
    return `<div class="product-tile" onclick="openProduct(${p.id})">
      <div class="pt-arrow">›</div>
      ${emojiCell}
      <div class="pt-name">${p.name}</div>
      ${bigLine}
      ${big2Line}
      <div class="pt-desc">${p.desc || p.strain}</div>
      <div class="pt-stars">${starRow(p.stars, 13)}<span class="rt">${p.stars.toFixed(1)}</span></div>
      ${fromHtml}
      ${badge}
      ${farmBadge}
    </div>`;
  }).join("") + soldOutTiles();

  // ═══ SOLD OUT PLACEHOLDER TILES (blurred, not clickable) ═══
  function soldOutTiles() {
    const base = "https://raw.githubusercontent.com/yardi-tg/my-shop-bot/main/";
    // mix of all available media as blurred previews
    const mixes = [
      [base+"vape1.jpg", base+"vape3.jpg", base+"vape2.jpg", base+"vape4.jpg"],
      [base+"vape4.jpg", base+"vape2.jpg", base+"vape1.jpg", base+"vape3.jpg"],
      [base+"vape2.jpg", base+"vape1.jpg", base+"vape4.jpg", base+"vape3.jpg"],
    ];
    const fakes = [
      { name: "Melon Runtz", big: "Cali Import", from: "ab CHF 55.–" },
      { name: "Ice Kief", big: "Dry Sift", from: "ab CHF 60.–" },
      { name: "Sugar Rosin", big: "Live Rosin", from: "ab CHF 70.–" },
    ];
    return fakes.map((f, idx) => {
      const imgs = mixes[idx].map(src => `<img src="${src}" onerror="this.style.visibility='hidden'">`).join("");
      return `
      <div class="product-tile sold-out">
        <div class="sold-stamp"><span>SOLD OUT</span></div>
        <div class="sold-inner">
          <div class="pt-collage">${imgs}</div>

        </div>
      </div>`;
    }).join("");
  }

  function openProduct(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
    const badge = p.import ? `<div class="pt-import">🇺🇸 <span class="import-text">USA Import</span></div>` : "";
    const farmBadge = p.farm ? `<div class="pt-farm">💎 <span class="pt-farm-text">${p.farm}</span></div>` : "";
    const variantsHtml = p.variants.map(v => {
      const isReq = v.price === 0;
      const priceHtml = isReq
        ? `<span class="v-price req">Preis Anfrage</span>`
        : `<span class="v-price">${CURRENCY} ${fmtPrice(v.price)}${v.per ? ' <span class="v-unit">/ pro Stück</span>' : ''}</span>`;
      return `<div class="variant ${isReq?'req':''}">
        <div class="v-left"><span class="v-qty">${v.label}</span>${priceHtml}</div>
        <button class="v-add" id="add-${v.key}" onclick="addVariant('${v.key}')">+ Hinzufügen</button>
        <div class="v-stepper" id="step-${v.key}">
          <button class="v-sbtn minus" onclick="changeVariant('${v.key}',-1)">−</button>
          <span class="v-snum" id="num-${v.key}">0</span>
          <button class="v-sbtn plus" onclick="changeVariant('${v.key}',1)">+</button>
        </div>
      </div>`;
    }).join("");
    document.getElementById("ppTitle").textContent = p.type || p.name;
    const noteHtml = p.strainNote ? `<div class="pp-note">📋 ${p.strainNote}</div>` : "";
    let flavorsHtml = "";
    if (p.flavors && p.flavors.length) {
      flavorsHtml = `<div class="pp-vlabel">Verfügbare Sorten</div>
        <div class="pp-flavors-text rainbow-text">` +
        p.flavors.map(f => `• ${f}`).join(", ") +
        `</div>`;
    }
    let heroMedia;
    const media = [];
    if (p.videos) p.videos.forEach(v => media.push(`<video src="${v}#t=0.1" class="pp-gvid" loop muted playsinline preload="metadata" onclick="toggleVid(this)"></video>`));
    if (p.photos) p.photos.forEach(src => media.push(`<img src="${src}" class="pp-gimg" onerror="this.style.display='none'">`));
    if (media.length) {
      const hint = (p.videos ? "← wischen für mehr Videos →" : "← wischen für mehr Bilder →");
      heroMedia = `<div class="pp-gallery">` + media.join("") + `</div><div class="pp-gallery-hint">${hint}</div>`;
    } else {
      heroMedia = `<div class="pp-emoji">${p.emoji}</div>`;
    }
    const mengeBlock = `
      <div class="pp-menge-toggle" id="mengeToggle" onclick="toggleMenge()">
        <span>Menge wählen</span>
        <span class="pp-menge-arrow" id="mengeArrow">▾</span>
      </div>
      <div class="pp-variants" id="ppVariants" style="display:none"><div class="variant-box">${variantsHtml}</div></div>`;
    // For vapes: show Menge FIRST, then the flavors list. Others: flavors then Menge.
    const middle = p.flavors ? (mengeBlock + flavorsHtml) : (flavorsHtml + mengeBlock);
    document.getElementById("ppBody").innerHTML = `
      <div class="pp-hero">
        ${heroMedia}
        <div class="pp-name">${p.name}${(p.big || p.shine) ? ` · ${p.big || p.shine}` : ""}</div>
        <div class="pp-sub">${p.strain}</div>
        <div class="pp-badges">
          <span class="pp-stars">${starRow(p.stars, 16)}<span class="rt">${p.stars.toFixed(1)}</span></span>
          ${badge}
          ${farmBadge}
        </div>
      </div>
      ${noteHtml}
      ${middle}`;
    document.getElementById("productPage").classList.add("open");
    // restore any existing cart quantities on the variant steppers
    p.variants.forEach(v => refreshVariant(v.key));
    // reset scroll positions: page to top, gallery to first video
    const pp = document.getElementById("productPage");
    pp.scrollTop = 0;
    const gal = pp.querySelector(".pp-gallery");
    if (gal) gal.scrollLeft = 0;
    // set up video autoplay-on-visible (only the >60% visible video plays)
    setTimeout(() => setupVideoObserver(), 60);
  }
  function closeProduct() {
    document.getElementById("productPage").classList.remove("open");
    const gal = document.querySelector(".pp-gallery");
    if (gal) gal.onscroll = null;
    document.querySelectorAll(".pp-gvid").forEach(v => v.pause());
  }
  let videoObserver = null;
  function playOnlyVisible() {
    const vids = [...document.querySelectorAll(".pp-gvid")];
    const gal = document.querySelector(".pp-gallery");
    if (!vids.length || !gal) return;
    const galRect = gal.getBoundingClientRect();
    let best = null, bestRatio = 0;
    vids.forEach(v => {
      const r = v.getBoundingClientRect();
      // visible width within the gallery viewport
      const visW = Math.max(0, Math.min(r.right, galRect.right) - Math.max(r.left, galRect.left));
      const ratio = visW / r.width;
      if (ratio > bestRatio) { bestRatio = ratio; best = v; }
    });
    vids.forEach(v => {
      if (v === best && bestRatio >= 0.6) {
        const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{});
      } else {
        v.pause();
      }
    });
  }
  function setupVideoObserver() {
    const vids = document.querySelectorAll(".pp-gvid");
    if (!vids.length) return;
    if (videoObserver) videoObserver.disconnect();
    // PAUSE ALL immediately to avoid double-play on open
    vids.forEach(v => v.pause());
    const gal = document.querySelector(".pp-gallery");
    // use scroll listener for precise "which is >60% visible" control
    if (gal) {
      gal.onscroll = () => { window.requestAnimationFrame(playOnlyVisible); };
    }
    // initial: play only the first (fully visible) one after layout settles
    setTimeout(playOnlyVisible, 120);
    setTimeout(playOnlyVisible, 350);
  }
  function toggleVid(v) {
    if (v.paused) v.play(); else v.pause();
  }
  function toggleMenge() {
    const v = document.getElementById("ppVariants");
    const a = document.getElementById("mengeArrow");
    const t = document.getElementById("mengeToggle");
    if (v.style.display === "none") {
      v.style.display = "block"; a.textContent = "▴"; t.classList.add("open");
      // smooth-scroll ~70% down (not all the way to top)
      setTimeout(() => {
        const pp = document.getElementById("productPage");
        const tRect = t.getBoundingClientRect();
        const ppRect = pp.getBoundingClientRect();
        // current toggle offset within the scroll container
        const toggleOffset = pp.scrollTop + tRect.top - ppRect.top;
        // scroll so toggle sits ~30% down from top (i.e. move ~70% of the way)
        const target = toggleOffset - pp.clientHeight * 0.30;
        pp.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
      }, 80);
    } else {
      v.style.display = "none"; a.textContent = "▾"; t.classList.remove("open");
    }
  }

  // ═══ CART LOGIC ═══
  function addVariant(key) {
    cart[key] = (cart[key] || 0) + 1;
    refreshVariant(key); updateCartUI();
  }
  function changeVariant(key, delta) {
    cart[key] = Math.max(0, (cart[key] || 0) + delta);
    if (cart[key] === 0) delete cart[key];
    refreshVariant(key); updateCartUI();
  }
  function refreshVariant(key) {
    const addBtn = document.getElementById(`add-${key}`);
    const step = document.getElementById(`step-${key}`);
    const num = document.getElementById(`num-${key}`);
    if (!addBtn || !step) return; // product page not open
    const qty = cart[key] || 0;
    if (qty > 0) { addBtn.style.display = "none"; step.classList.add("active"); if (num) num.textContent = qty; }
    else { addBtn.style.display = "block"; step.classList.remove("active"); }
  }

  function cartTotals() {
    let count = 0, total = 0, hasReq = false;
    for (const key in cart) {
      const found = findVariant(key); if (!found) continue;
      const qty = cart[key];
      count += qty;
      if (found.variant.price === 0) hasReq = true;
      else total += lineTotalOf(found.variant, qty);
    }
    return { count, total, hasReq };
  }

  function updateCartUI() {
    const { count, total } = cartTotals();
    const badge = document.getElementById("cartBadge");
    badge.textContent = count; badge.classList.toggle("show", count > 0);
    const fc = document.getElementById("floatingCart");
    document.getElementById("fcCount").textContent = count;
    document.getElementById("fcTotal").textContent = `${CURRENCY} ${fmtPrice(total)}`;
    fc.classList.toggle("show", count > 0);
    // product page cart badge
    const ppBadge = document.getElementById("ppCartBadge");
    if (ppBadge) { ppBadge.textContent = count; ppBadge.classList.toggle("show", count > 0); }
  }

  function openCart() {
    renderCartItems();
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawerOverlay").classList.add("open");
    document.getElementById("floatingCart").classList.remove("show");
  }
  function closeCart() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("open");
    updateCartUI();
  }

  function renderCartItems() {
    const container = document.getElementById("cartItems");
    const footer = document.getElementById("cartFooter");
    const keys = Object.keys(cart).filter(k => cart[k] > 0);
    if (keys.length === 0) {
      container.innerHTML = `<div class="empty-cart"><div class="empty-cart-icon">🛒</div>Ihr Warenkorb ist leer</div>`;
      footer.style.display = "none";
      return;
    }
    container.innerHTML = keys.map(key => {
      const { product, variant } = findVariant(key);
      const qty = cart[key];
      const isReq = variant.price === 0;
      const lineTotal = lineTotalOf(variant, qty);
      const priceText = isReq
        ? `<div class="cart-item-price req">Preis Anfrage</div>`
        : `<div class="cart-item-price">${CURRENCY} ${fmtPrice(lineTotal)}${variant.per ? ` (${CURRENCY} ${fmtPrice(variant.price)}/Stk)` : ''}</div>`;
      return `<div class="cart-item">
        <div class="cart-item-emoji">${product.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${product.name} · ${variant.label}</div>
          ${priceText}
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeVariant('${key}',-1)">−</button>
          <div class="qty-num">${qty}</div>
          <button class="qty-btn" onclick="changeVariant('${key}',1)">+</button>
        </div>
      </div>`;
    }).join("");
    const { total, hasReq } = cartTotals();
    document.getElementById("cartTotal").textContent = `${CURRENCY} ${fmtPrice(total)}`;
    document.getElementById("reqNote").style.display = hasReq ? "block" : "none";
    footer.style.display = "block";
  }

  // ═══ SUBMIT ORDER ═══
  function submitOrder() {
    const keys = Object.keys(cart).filter(k => cart[k] > 0);
    if (keys.length === 0) return;

    let lines = [], total = 0, reqItems = [];
    keys.forEach(key => {
      const { product, variant } = findVariant(key);
      const qty = cart[key];
      if (variant.price === 0) {
        lines.push(`- ${qty}x ${product.name} · ${variant.label} — (Preis Anfrage)`);
        reqItems.push(`${variant.label} ${product.name}`);
      } else {
        const lineTotal = lineTotalOf(variant, qty);
        total += lineTotal;
        const per = variant.per ? ` (${CURRENCY} ${fmtPrice(variant.price)}/Stk)` : "";
        lines.push(`- ${qty}x ${product.name} · ${variant.label} — ${CURRENCY} ${fmtPrice(lineTotal)}${per}`);
      }
    });

    const note = document.getElementById("orderNote").value.trim();
    let msg = `Ich würde gerne folgendes bestellen:\n\n${lines.join("\n")}\n\nTotal: ${CURRENCY} ${fmtPrice(total)}`;
    if (reqItems.length > 0) {
      msg += `\n(+ Preis Anfrage auf ${reqItems.join(", ")})`;
    }
    if (note) msg += `\n\nNotiz: ${note}`;

    const deepLink = `https://t.me/${OWNER_USERNAME}?text=${encodeURIComponent(msg)}`;
    if (tg) { tg.openTelegramLink(deepLink); setTimeout(()=>tg.close(),500); }
    else { window.open(deepLink, "_blank"); }
  }
</script>
