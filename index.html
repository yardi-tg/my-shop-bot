<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mein Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #e8c97e;
      --accent2: #c9a84c;
      --text: #f0ece2;
      --muted: #888;
      --danger: #e07070;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .cart-btn {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 8px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .cart-btn:hover { background: var(--border); }
    .cart-badge {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }
    .cart-badge.show { display: flex; }

    /* CATEGORIES */
    .categories {
      display: flex;
      gap: 10px;
      padding: 16px 20px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 50px;
      padding: 7px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* SECTION HEADER */
    .section-label {
      padding: 12px 20px 6px;
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--accent);
    }

    /* PRODUCT GRID */
    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 8px 20px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
      animation: fadeUp 0.4s ease both;
    }
    .product-card:hover { transform: translateY(-2px); border-color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--surface2);
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-info { padding: 12px; }
    .product-name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .product-desc {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .product-price {
      font-weight: 600;
      font-size: 15px;
      color: var(--accent);
    }
    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
      line-height: 1;
    }
    .add-btn:hover { transform: scale(1.15); background: var(--accent2); }
    .add-btn.in-cart {
      background: var(--surface2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    /* CART DRAWER */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }

    .drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      z-index: 201;
      padding: 20px 20px 40px;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .drawer.open { transform: translateY(0); }

    .drawer-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .drawer-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--accent);
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-emoji { font-size: 28px; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 14px; font-weight: 500; }
    .cart-item-price { font-size: 13px; color: var(--accent); }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-num { font-size: 14px; font-weight: 600; min-width: 16px; text-align: center; }

    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .total-amount { color: var(--accent); font-size: 20px; }

    /* NOTE INPUT */
    .note-section { margin: 10px 0 16px; }
    .note-section label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }
    .note-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .note-input:focus { border-color: var(--accent); }
    .note-input::placeholder { color: var(--muted); }

    /* ORDER BUTTON */
    .order-btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .order-btn:hover { background: var(--accent2); transform: scale(1.01); }
    .order-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

    /* FLOATING CART BAR */
    #floatingCart {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      border-radius: 16px;
      padding: 16px 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      z-index: 150;
      box-shadow: 0 8px 30px rgba(232,201,126,0.35);
      transform: translateY(100px);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
      animation: none;
    }
    #floatingCart.show {
      display: flex;
      transform: translateY(0);
    }
    #floatingCart:active { transform: scale(0.98); }
    .fc-left {
      background: rgba(0,0,0,0.15);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 13px;
    }
    .fc-center {
      letter-spacing: 0.5px;
    }
    .fc-right {
      font-size: 16px;
    }

    /* EMPTY CART */
    .empty-cart {
      text-align: center;
      padding: 30px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-cart-icon { font-size: 40px; margin-bottom: 10px; }

    /* SUCCESS SCREEN */
    .success-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      animation: fadeIn 0.4s ease;
    }
    .success-screen.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .success-icon { font-size: 72px; margin-bottom: 20px; animation: pop 0.5s ease 0.2s both; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .success-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .success-sub { color: var(--muted); font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake-error {
      animation: shake 0.4s ease !important;
    }
    #codeInput:focus {
      border-color: #e8c97e !important;
      box-shadow: 0 0 12px #e8c97e44;
    }
    /* MATRIX CANVAS */
    #matrixCanvas {
      position: fixed;
      inset: 0;
      z-index: 600;
      display: none;
      background: #000;
    }
    /* SHATTER TILES */
    .shatter-tile {
      position: fixed;
      background: #000;
      border: 1px solid #0f03;
      z-index: 700;
      transition: transform 1.8s cubic-bezier(0.4, 0, 1, 1), opacity 1.8s ease;
      pointer-events: none;
    }
    @keyframes glitchFlash {
      0%, 100% { opacity: 0; }
      10% { opacity: 1; }
      20% { opacity: 0; }
      30% { opacity: 0.8; }
      40% { opacity: 0; }
    }
    #glitchFlash {
      position: fixed;
      inset: 0;
      background: #0f0;
      z-index: 650;
      display: none;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>

  <div id="lockScreen" style="position:fixed;inset:0;background:#0f0f0f;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;transition:opacity 0.6s ease;">
    <div id="lockIcon" style="font-size:56px;margin-bottom:20px;transition:all 0.3s;">🔒</div>
    <div style="font-family:'Playfair Display',serif;font-size:26px;color:#e8c97e;margin-bottom:8px;">Blocktheke</div>
    <div style="color:#888;font-size:13px;margin-bottom:32px;letter-spacing:1px;">ZUGANGSCODE EINGEBEN</div>
    <input id="codeInput" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="background:#1a1a1a;border:2px solid #2e2e2e;color:#e8c97e;border-radius:14px;padding:16px 20px;font-size:28px;text-align:center;letter-spacing:12px;width:170px;outline:none;margin-bottom:20px;transition:border-color 0.2s, box-shadow 0.2s;font-family:'DM Sans',sans-serif;" />
    <button id="unlockBtn" style="background:#e8c97e;color:#000;border:none;border-radius:14px;padding:15px 40px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:transform 0.15s,background 0.2s;">🔓 ENTSPERREN</button>
    <div id="lockError" style="color:#e07070;font-size:13px;margin-top:16px;display:none;"></div>
  </div>

  <canvas id="matrixCanvas"></canvas>
  <div id="glitchFlash"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">✦ Blocktheke</div>
    <button class="cart-btn" onclick="openCart()">
      🛒 Warenkorb
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>

  <!-- CATEGORIES -->
  <div class="categories" id="categories"></div>

  <!-- PRODUCTS -->
  <div id="productSections"></div>

  <!-- FLOATING CART BAR -->
  <div id="floatingCart" onclick="openCart()">
    <div class="fc-left">
      <span id="fcCount">0</span> Artikel
    </div>
    <div class="fc-center">Zum Warenkorb</div>
    <div class="fc-right" id="fcTotal">CHF 0</div>
  </div>

  <!-- CART DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeCart()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">Ihre Bestellung</div>
    <div id="cartItems"></div>
    <div id="cartFooter" style="display:none">
      <div class="cart-total">
        <span>Gesamt</span>
        <span class="total-amount" id="cartTotal"></span>
      </div>
      <div class="note-section">
        <label>Notiz hinzufügen (optional)</label>
        <textarea class="note-input" id="orderNote" rows="2" placeholder="z.B. Keine Zwiebeln, Lieferung an Tor 2..."></textarea>
      </div>
      <button class="order-btn" id="orderBtn" onclick="submitOrder()">Jetzt bestellen</button>
    </div>
  </div>

  <!-- SUCCESS SCREEN -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">🎉</div>
    <div class="success-title">Bestellung gesendet!</div>
    <div class="success-sub">Ihre Bestellung wurde empfangen.<br>Wir melden uns in Kürze bei Ihnen.</div>
  </div>

<script>
  // ─── EDIT YOUR PRODUCTS HERE ───────────────────────────────────────────────
  const PRODUCTS = [

    { id: 2, name: "Karotten", desc: "Frische Karotten, 1kg", price: 2.50, emoji: "🥕", category: "Gemüse" },

    { id: 6, name: "Paprika", desc: "Bunte Paprika-Mix, 500g", price: 4.00, emoji: "🫑", category: "Gemüse" },
    { id: 7, name: "Aubergine", desc: "Frische Aubergine, 500g", price: 3.20, emoji: "🍆", category: "Gemüse" },
    { id: 8, name: "Salat", desc: "Frischer grüner Salat, 1 Stück", price: 2.00, emoji: "🥬", category: "Salat & Kräuter" },

    { id: 10, name: "Basilikum", desc: "Frisches Basilikum, 1 Bund", price: 1.80, emoji: "🌿", category: "Salat & Kräuter" },
    { id: 11, name: "Kartoffeln", desc: "Festkochende Kartoffeln, 1kg", price: 2.00, emoji: "🥔", category: "Wurzelgemüse" },
    { id: 12, name: "Rote Beete", desc: "Frische Rote Beete, 500g", price: 2.50, emoji: "🫚", category: "Wurzelgemüse" },
    { id: 13, name: "Zwiebeln", desc: "Gelbe Zwiebeln, 1kg", price: 1.80, emoji: "🧅", category: "Wurzelgemüse" },

  ];

  // ─── CURRENCY SYMBOL ────────────────────────────────────────────────────────
  const CURRENCY = "CHF";

  setInterval(() => {

  // ── Lock screen logic ──────────────────────────────────────
  document.getElementById("unlockBtn").addEventListener("click", checkAccessCode);
  document.getElementById("codeInput").addEventListener("keypress", (e) => {

  });

  // ═══ MATRIX UNLOCK ANIMATION ═══
  function startMatrixSequence() {
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = "block";

    const chars = "アイウエオカキクケコ0123456789ABCDEFXYZ$#@%&";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    let matrixRunning = true;

    function drawMatrix() {
      if (!matrixRunning) return;
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f0";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    // Show "ZUGRIFF GEWÄHRT" text in the middle after 1.2s
    setTimeout(() => {
      ctx.save();
    }, 1200);

    // After 2 seconds: shatter
    setTimeout(() => {
      matrixRunning = false;
      shatterScreen(canvas);
    }, 2000);
  }

  function shatterScreen(canvas) {
    const lockScreen = document.getElementById("lockScreen");

    // Snapshot the matrix canvas as the image we'll shatter
    const snapshot = canvas.toDataURL();
    lockScreen.style.display = "none";

    // Create many triangular glass shards using clip-path for a realistic break
    const cols = 9, rows = 16;
    const w = window.innerWidth, h = window.innerHeight;
    const cellW = w / cols, cellH = h / rows;
    const shards = [];
    const container = document.createElement("div");
    container.style.cssText = "position:fixed;inset:0;z-index:700;pointer-events:none;overflow:hidden;";
    document.body.appendChild(container);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        // Two triangles per cell for a jagged glass look
        for (let t = 0; t < 2; t++) {
          const shard = document.createElement("div");
          const clip = t === 0
            ? "polygon(0 0, 100% 0, 0 100%)"
            : "polygon(100% 0, 100% 100%, 0 100%)";
          shard.style.cssText = `
            position:absolute;
            left:${c*cellW}px; top:${r*cellH}px;
            width:${cellW}px; height:${cellH}px;
            background-image:url(${snapshot});
            background-position:-${c*cellW}px -${r*cellH}px;
            background-size:${w}px ${h}px;
            clip-path:${clip};
            -webkit-clip-path:${clip};
            transition: transform 1.1s cubic-bezier(0.3,0.1,0.2,1), opacity 1.1s ease;
            will-change: transform, opacity;
          `;
          container.appendChild(shard);
          shards.push({ el: shard, cx: c*cellW + cellW/2, cy: r*cellH + cellH/2 });
        }
      }
    }

    canvas.style.display = "none";

    // Explode shards outward from center with gravity + spin
    const centerX = w / 2, centerY = h / 2;
    requestAnimationFrame(() => {
      shards.forEach(s => {
        const dx = s.cx - centerX;
        const dy = s.cy - centerY;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const force = 1.2 + Math.random() * 1.3;
        const x = (dx / dist) * dist * force + (Math.random()-0.5)*100;
        const y = (dy / dist) * dist * force + 300 + Math.random()*200; // gravity pull down
        const rot = (Math.random() - 0.5) * 540;
        s.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(0.4)`;
        s.el.style.opacity = "0";
      });
      setTimeout(() => { container.remove(); }, 1200);
    });

    // Header welcome pop
    setTimeout(() => {
      const header = document.querySelector(".header-title");
      if (header) {
        header.style.transition = "transform 0.5s cubic-bezier(0.34,1.56,0.64,1)";
        header.style.transform = "scale(1.15)";
        setTimeout(() => { header.style.transform = "scale(1)"; }, 500);
      }
    }, 300);
  }

  async function checkAccessCode() {
    const code = document.getElementById("codeInput").value.trim();
    const errorEl = document.getElementById("lockError");
    const btn = document.getElementById("unlockBtn");
    const lockIcon = document.getElementById("lockIcon");
    const input = document.getElementById("codeInput");

    if (code.length !== 4) {
      errorEl.textContent = "Bitte gib den 4-stelligen Code ein.";
      errorEl.style.display = "block";
      input.classList.remove("shake-error");
      void input.offsetWidth;
      input.classList.add("shake-error");
      return;
    }

    btn.textContent = "Wird geprüft...";
    btn.disabled = true;

    try {
      const res = await fetch(BOT_BACKEND_URL.replace("/order", "/check-code"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      const data = await res.json();

      if (data.valid) {
        // ═══ EPIC MATRIX UNLOCK ═══
        lockIcon.textContent = "🔓";
        input.style.borderColor = "#0f0";
        input.style.boxShadow = "0 0 20px #0f06";
        btn.textContent = "ACCESS GRANTED";
        btn.style.background = "#0f0";
        btn.style.color = "#000";
        btn.style.fontFamily = "monospace";
        startMatrixSequence();

      } else {
        // Error animation
        btn.textContent = "🔓 ENTSPERREN";
        btn.disabled = false;
        errorEl.textContent = "❌ Falscher Code! Frage den Shopinhaber nach dem heutigen Code.";
        errorEl.style.display = "block";
        input.style.borderColor = "#e07070";
        input.value = "";
        input.classList.remove("shake-error");
        void input.offsetWidth;
        input.classList.add("shake-error");
        lockIcon.textContent = "🔒";
        setTimeout(() => { input.style.borderColor = "#2e2e2e"; }, 1000);
      }
    } catch (e) {
      btn.textContent = "🔓 ENTSPERREN";
      btn.disabled = false;
      errorEl.textContent = "⏳ Server wacht auf... Bitte warte 30 Sekunden und versuche es erneut!";
      errorEl.style.display = "block";
    }
  }

  let cart = {}; // { productId: quantity }

  // Build unique categories
  const categories = ["Alle", ...new Set(PRODUCTS.map(p => p.category))];

  // Render categories
  const catContainer = document.getElementById("categories");
  categories.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (i === 0 ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => filterCategory(cat, btn);
    catContainer.appendChild(btn);
  });

  function filterCategory(cat, btn) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".product-section").forEach(section => {
      section.style.display = (cat === "Alle" || section.dataset.cat === cat) ? "block" : "none";
    });
  }

  // Render products grouped by category
  const sectionsEl = document.getElementById("productSections");
  const uniqueCats = [...new Set(PRODUCTS.map(p => p.category))];
  uniqueCats.forEach(cat => {
    const section = document.createElement("div");
    section.className = "product-section";
    section.dataset.cat = cat;
    section.innerHTML = `<div class="section-label">${cat}</div>`;
    const grid = document.createElement("div");
    grid.className = "products";
    PRODUCTS.filter(p => p.category === cat).forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.style.animationDelay = `${i * 0.07}s`;
      card.id = `card-${p.id}`;
      card.innerHTML = `
        <div class="product-img">${p.emoji}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div class="product-footer">
            <div class="product-price">${CURRENCY} ${p.price.toFixed(2)}</div>
            <button class="add-btn" id="addbtn-${p.id}" onclick="addToCart(${p.id})">+</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    sectionsEl.appendChild(section);
  });

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCartUI();
    const btn = document.getElementById(`addbtn-${id}`);
    btn.classList.add("in-cart");
    btn.textContent = cart[id];
    setTimeout(() => { btn.textContent = cart[id] > 0 ? cart[id] : "+"; }, 0);
  }

  function updateCartUI() {
    const count = Object.values(cart).reduce((a, b) => a + b, 0);
    const badge = document.getElementById("cartBadge");
    badge.textContent = count;
    badge.classList.toggle("show", count > 0);

    // Update floating cart bar
    const fc = document.getElementById("floatingCart");
    const priceTotal = Object.keys(cart).reduce((sum, id) => {
      const p = PRODUCTS.find(p => p.id == id);
      return sum + (p ? p.price * cart[id] : 0);
    }, 0);
    document.getElementById("fcCount").textContent = count;
    document.getElementById("fcTotal").textContent = `${CURRENCY} ${priceTotal.toFixed(2)}`;
    fc.classList.toggle("show", count > 0);
  }

  function openCart() {
    renderCartItems();
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawerOverlay").classList.add("open");
    document.getElementById("floatingCart").classList.remove("show");
  }

  function closeCart() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("open");
    updateCartUI();
  }

  function renderCartItems() {
    const container = document.getElementById("cartItems");
    const footer = document.getElementById("cartFooter");
    const cartKeys = Object.keys(cart).filter(id => cart[id] > 0);

    if (cartKeys.length === 0) {
      container.innerHTML = `<div class="empty-cart"><div class="empty-cart-icon">🛒</div>Ihr Warenkorb ist leer</div>`;
      footer.style.display = "none";
      return;
    }

    let total = 0;
    container.innerHTML = cartKeys.map(id => {
      const p = PRODUCTS.find(p => p.id == id);
      const subtotal = p.price * cart[id];
      total += subtotal;
      return `<div class="cart-item">
        <div class="cart-item-emoji">${p.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-price">${CURRENCY} ${subtotal.toFixed(2)}</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
          <div class="qty-num">${cart[id]}</div>
          <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
        </div>
      </div>`;
    }).join("");

    document.getElementById("cartTotal").textContent = `${CURRENCY} ${total.toFixed(2)}`;
    footer.style.display = "block";
  }

  function changeQty(id, delta) {
    cart[id] = Math.max(0, (cart[id] || 0) + delta);
    if (cart[id] === 0) delete cart[id];

    // Update add button on product card
    const btn = document.getElementById(`addbtn-${id}`);
    if (btn) {
      if (cart[id] > 0) { btn.classList.add("in-cart"); btn.textContent = cart[id]; }
      else { btn.classList.remove("in-cart"); btn.textContent = "+"; }
    }
    updateCartUI();
    renderCartItems();
  }

  function submitOrder() {
    const cartKeys = Object.keys(cart).filter(id => cart[id] > 0);
    if (cartKeys.length === 0) return;

    const items = cartKeys.map(id => {
      const p = PRODUCTS.find(p => p.id == id);
      return { name: p.name, qty: cart[id], price: p.price };
    });

    const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
    const note = document.getElementById("orderNote").value.trim();

    // Build the pre-written message the customer sends to YOU
    const itemLines = items.map(i => `- ${i.qty}x ${i.name} — ${CURRENCY} ${(i.qty * i.price).toFixed(2)}`).join("\n");
    const noteSection = note ? `\n📝 Notiz: ${note}` : "";
    const orderText =
      `Ich möchte gerne bestellen.\n` +
      `${itemLines}\n` +
      `💰 Total: ${CURRENCY} ${total.toFixed(2)}` +
      noteSection;

    // Open YOUR personal Telegram chat with the order already typed
    // Customer just taps Send!
    const ownerUsername = "Standonbu51ness";
    const deepLink = `https://t.me/${ownerUsername}?text=${encodeURIComponent(orderText)}`;

    if (tg) {
      tg.openTelegramLink(deepLink);
      setTimeout(() => tg.close(), 500);
    } else {
      window.open(deepLink, "_blank");
    }
  }
</script>
</body>
</html>
