<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocktheke</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14100a;
      --surface: #2b2110;
      --surface2: #3f3018;
      --border: rgba(255,205,110,0.22);
      --accent: #ffcf6b;
      --accent2: #e0a020;
      --text: #fff8ea;
      --muted: #b8a98a;
      --danger: #ff7a7a;
      --star: #ffcf6b;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═══ FLOATING SMOKE BACKGROUND ═══ */
    .smoke-bg {
      position: fixed; inset: -25%; z-index: 900;
      pointer-events: none; overflow: hidden;
    }
    .smoke-bg span {
      position: absolute; display: block; border-radius: 50%;
      will-change: transform;
    }
    .smoke-bg .s1 {
      width: 62vw; height: 62vw; left: 4%; top: 12%;
      background: radial-gradient(circle at 42% 45%, rgba(255,240,205,0.15), rgba(235,185,90,0.08) 48%, transparent 72%);
      animation: smokeA 52s ease-in-out infinite alternate;
    }
    .smoke-bg .s2 {
      width: 78vw; height: 78vw; right: -6%; top: 30%;
      background: radial-gradient(circle at 55% 40%, rgba(255,230,180,0.10), rgba(215,155,55,0.06) 50%, transparent 74%);
      animation: smokeB 68s ease-in-out infinite alternate;
    }
    .smoke-bg .s3 {
      width: 55vw; height: 55vw; left: 22%; bottom: 6%;
      background: radial-gradient(circle at 48% 52%, rgba(255,245,225,0.13), rgba(245,200,110,0.07) 46%, transparent 70%);
      animation: smokeC 60s ease-in-out infinite alternate;
    }
    .smoke-bg .s4 {
      width: 44vw; height: 44vw; right: 14%; bottom: 26%;
      background: radial-gradient(circle at 50% 50%, rgba(255,235,195,0.09), rgba(200,140,45,0.05) 47%, transparent 72%);
      animation: smokeD 45s ease-in-out infinite alternate;
    }
    .smoke-bg .s5 {
      width: 70vw; height: 70vw; left: -12%; top: 48%;
      background: radial-gradient(circle at 46% 44%, rgba(255,238,215,0.14), rgba(240,190,100,0.07) 50%, transparent 74%);
      animation: smokeE 75s ease-in-out infinite alternate;
    }
    @keyframes smokeA { from { transform: translate(-6vw,-4vh) scale(1) rotate(0deg); } to { transform: translate(20vw,10vh) scale(1.28) rotate(16deg); } }
    @keyframes smokeB { from { transform: translate(5vw,6vh) scale(1.15) rotate(8deg); } to { transform: translate(-16vw,-8vh) scale(0.92) rotate(-12deg); } }
    @keyframes smokeC { from { transform: translate(-4vw,5vh) scale(0.95) rotate(-6deg); } to { transform: translate(14vw,-11vh) scale(1.22) rotate(14deg); } }
    @keyframes smokeD { from { transform: translate(6vw,-3vh) scale(1.1) rotate(10deg); } to { transform: translate(-12vw,9vh) scale(0.9) rotate(-10deg); } }
    @keyframes smokeE { from { transform: translate(3vw,4vh) scale(1) rotate(0deg); } to { transform: translate(-10vw,-13vh) scale(1.3) rotate(-18deg); } }
    /* smoke drifts OVER the whole room (very low opacity, clicks pass through) */
    .header, .products { position: relative; z-index: 1; }

    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(1100px 700px at 85% -10%, rgba(220,160,40,0.30), transparent 60%),
        radial-gradient(900px 650px at -15% 108%, rgba(78,50,8,0.48), transparent 62%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,7,26,0.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title {
      font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: 0.5px;
      background: linear-gradient(95deg, #fff8e8, #ffcf6b 45%, #c88a12);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 14px rgba(230,170,50,0.52));
    }
    .cart-btn {
      position: relative; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 50px; padding: 8px 16px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .cart-badge {
      background: var(--accent); color: #000; font-size: 11px; font-weight: 700;
      border-radius: 50%; width: 18px; height: 18px;
      display: none; align-items: center; justify-content: center;
    }
    .cart-badge.show { display: flex; }

    /* PRODUCT GRID (tall tiles, 2 per row, equal height) */
    .products { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; }

    .product-tile {
      position: relative;
      background: linear-gradient(145deg, var(--surface2), var(--surface));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 11px 12px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; cursor: pointer;
      animation: fadeUp 0.4s ease both;
      transition: transform 0.15s, border-color 0.15s;
    }
    .product-tile:active { transform: scale(0.97); border-color: var(--accent); }
    .product-tile.sold-out {
      position: relative; cursor: default; overflow: hidden;
    }
    .product-tile.sold-out:active { transform: none; border-color: var(--border); }
    .sold-inner {
      filter: blur(5px) grayscale(0.3); opacity: 0.55; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%;
    }
    .sold-stamp {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) rotate(-14deg);
      z-index: 5;
      border: 4px solid #c62828; border-radius: 6px;
      padding: 5px 14px; white-space: nowrap;
      /* rough, weathered edges via SVG turbulence displacement */
      filter: url(#grunge);
      background: transparent;
      opacity: 0.9;
    }
    .sold-stamp span {
      display: block;
      font-family: 'Arial Black', 'DM Sans', sans-serif;
      font-size: 24px; font-weight: 900; letter-spacing: 1px;
      color: #c62828; text-transform: uppercase;
      -webkit-text-stroke: 0.4px #c62828;
    }
    /* faded ink patches over the stamp for authenticity */
    .sold-stamp::after {
      content: ""; position: absolute; inset: -4px;
      background:
        radial-gradient(circle at 20% 30%, transparent 40%, rgba(15,15,15,0.55) 55%, transparent 60%),
        radial-gradient(circle at 70% 60%, transparent 35%, rgba(15,15,15,0.5) 50%, transparent 55%),
        radial-gradient(circle at 45% 80%, transparent 30%, rgba(15,15,15,0.45) 45%, transparent 50%);
      pointer-events: none; mix-blend-mode: multiply; border-radius: 6px;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .pt-emoji {
      font-size: 34px; line-height: 1; margin-bottom: 9px;
      width: 60px; height: 60px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pt-collage {
      width: 70px; height: 70px; border-radius: 12px; overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 2px; margin-bottom: 9px; border: 1px solid var(--border); flex-shrink: 0;
      background: var(--surface);
    }
    .pt-collage img {
      width: 100%; height: 100%; object-fit: cover;
      min-width: 0; min-height: 0; display: block;
      background: var(--surface2);
    }
    .pt-collage-v3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 70px; height: 70px; }
    .pt-collage-v3 video {
      width: 100%; height: 100%; min-width: 0; min-height: 0;
      object-fit: cover; object-position: center; pointer-events: none; display: block;
      background: #2b2110;
    }
    .pt-collage-v3 video:not(.loaded) {
      background: linear-gradient(135deg, #2b2110 25%, #4a3a16 50%, #2b2110 75%);
      background-size: 400% 400%;
      animation: vidShimmer 1.6s ease infinite;
    }
    .pt-collage-v3 .vid-wide { grid-column: 1 / -1; }
    .pt-name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 2px; letter-spacing:-0.2px; }
    .pt-strain { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.2; margin-bottom: 2px; }
    .pt-strain2 { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.25; margin-bottom: 7px; }
    .pt-desc { font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; flex: 1; }
    .pt-stars { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom: 8px; }
    .pt-stars .rt { color: var(--muted); font-size: 12px; font-weight:600; }
    .pt-from { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .badge-import {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      background: rgba(255,205,110,0.14); color: var(--accent);
      padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
    }
    .pt-import {
      margin-top: 8px;
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid rgba(255,205,110,0.4);
      background: linear-gradient(145deg, rgba(255,205,110,0.10), rgba(0,0,0,0.22));
      box-shadow: 0 2px 12px rgba(255,205,110,0.14), inset 0 1px 0 rgba(255,255,255,0.06);
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .import-text {
      background-image: linear-gradient(90deg, #ffcf6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ffcf6b);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: farmRainbow 4s linear infinite;
    }
    .pt-arrow {
      position: absolute; top: 12px; right: 12px;
      color: var(--muted); font-size: 16px;
    }
    .pt-shine { margin: 1px 0 3px; }
    .shine-text {
      font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
      background: linear-gradient(110deg, #8a8a8a 0%, #cfcfcf 25%, #ffffff 50%, #cfcfcf 75%, #8a8a8a 100%);
      background-size: 220% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: silverShine 3s linear infinite;
      text-shadow: 0 0 1px rgba(255,255,255,0.1);
    }
    @keyframes silverShine {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }
    .pt-farm {
      margin-top: 10px;
      padding: 7px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,205,110,0.45);
      background: linear-gradient(145deg, rgba(255,205,110,0.12), rgba(0,0,0,0.25));
      box-shadow: 0 3px 14px rgba(255,205,110,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
      font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .pt-farm-text {
      background-image: linear-gradient(90deg, #ffcf6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ffcf6b);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: farmRainbow 4s linear infinite;
    }
    @keyframes farmRainbow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* FULL PRODUCT PAGE (overlay) */
    .product-page {
      position: fixed; inset: 0; z-index: 300;
      background:
        radial-gradient(1100px 700px at 85% -10%, rgba(220,160,40,0.30), transparent 60%),
        radial-gradient(900px 650px at -15% 108%, rgba(78,50,8,0.48), transparent 62%),
        var(--bg);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      overflow-y: auto;
      padding-bottom: 40px;
    }
    .product-page.open { transform: translateX(0); }
    .pp-header {
      position: sticky; top: 0; z-index: 5;
      background: rgba(13,7,26,0.86); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    }
    .pp-back-text {
      background: var(--surface2); border: 1px solid var(--border); color: var(--accent);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
      padding: 8px 14px; border-radius: 50px; justify-self: start;
    }
    .pp-back-text:active { transform: scale(0.96); }
    .pp-htitle { font-size: 15px; font-weight: 700; color: var(--text); text-align: center; white-space: nowrap; }
    .pp-cart-btn {
      position: relative; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 50px; padding: 7px 12px; font-size: 16px; cursor: pointer;
      justify-self: end; display: flex; align-items: center;
    }
    .pp-cart-badge {
      background: var(--accent); color: #000; font-size: 10px; font-weight: 700;
      border-radius: 50%; min-width: 16px; height: 16px; padding: 0 4px;
      display: none; align-items: center; justify-content: center; margin-left: 4px;
    }
    .pp-cart-badge.show { display: inline-flex; }
    .pp-hero {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 28px 20px 20px;
    }
    .pp-emoji {
      width: 100px; height: 100px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; margin-bottom: 16px;
    }
    .pp-gallery {
      display: flex; gap: 10px; overflow-x: auto; width: 100%;
      scroll-snap-type: x mandatory; padding: 4px 0 8px; margin-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .pp-gallery::-webkit-scrollbar { height: 0; }
    .pp-gimg {
      width: 240px; height: 240px; object-fit: cover; border-radius: 16px;
      border: 1px solid var(--border); flex-shrink: 0; scroll-snap-align: center;
      background: var(--surface2); display: block;
    }
    .pp-gvid {
      height: 48vh; max-height: 420px; width: auto; max-width: 78vw;
      min-width: 60vw;
      border-radius: 18px; border: 1px solid var(--border);
      flex-shrink: 0; scroll-snap-align: center;
      display: block; object-fit: cover; cursor: pointer;
      background: #2b2110;
      transform: translateZ(0);
    }
    /* shimmer ONLY until the video has data, then it stops (saves GPU while scrolling) */
    .pp-gvid:not(.loaded) {
      background: linear-gradient(135deg, #2b2110 25%, #4a3a16 50%, #2b2110 75%);
      background-size: 400% 400%;
      animation: vidShimmer 1.5s ease infinite;
    }
    @keyframes vidShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    .pp-gvid::-webkit-media-controls { display: none !important; }
    .pp-gvid::-webkit-media-controls-enclosure { display: none !important; }
    .pp-gallery { padding-left: 5vw; padding-right: 5vw; gap: 14px; justify-content: flex-start; }
    .pp-gallery-hint { font-size: 14px; font-weight:600; color: var(--accent); margin-bottom: 16px; }
    .pp-name { font-family: 'Playfair Display', serif; font-size: 21px; color: var(--text); margin-bottom: 6px; line-height: 1.25; }
    /* Letzte Bestellung Banner */
    #lastOrderBanner { padding: 0 16px; margin: 8px 0 4px; }
    .lo-card {
      background: linear-gradient(135deg, var(--surface), var(--surface2));
      border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
    }
    .lo-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .lo-label { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.4px; text-transform: uppercase; }
    .lo-close {
      background: rgba(255,205,110,0.10); border: 1px solid var(--border);
      color: var(--accent); font-size: 15px; line-height: 1;
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; padding: 0; transition: transform 0.1s, background 0.15s;
    }
    .lo-close:active { transform: scale(0.9); background: rgba(255,205,110,0.22); }
    .lo-items { font-size: 14px; color: var(--text); margin-bottom: 12px; line-height: 1.4; }
    .lo-btn {
      width: 100%; background: var(--accent); color: #1f1504; border: none;
      border-radius: 12px; padding: 12px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.3px;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .lo-btn:active { transform: scale(0.98); }
    .pp-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .pp-badges { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .pp-badges .pt-import, .pp-badges .pt-farm { margin-top: 0; }
    .pp-stars { display:inline-flex; align-items:center; gap:6px; }
    .pp-stars .rt { color: var(--muted); font-size: 13px; font-weight:600; }
    .pp-note { margin: 8px 16px 0; padding: 12px 14px; background: rgba(255,205,110,0.08); border:1px solid var(--border); border-radius:12px; font-size:13px; color:var(--accent); text-align:center; }
    .pp-flavors-text { padding: 4px 16px 12px; font-size:14px; line-height:1.9; color:var(--text); font-weight:500; }
    .rainbow-text {
      background: linear-gradient(180deg, #ffcf6b, #ffa726, #ffee58, #66bb6a, #26c6da, #42a5f5, #7e57c2, #ec407a, #ffcf6b);
      background-size: 100% 300%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: rainbowFlow 8s linear infinite;
      font-weight: 600;
    }
    @keyframes rainbowFlow {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 300%; }
    }
    .pp-menge-toggle {
      margin: 10px 16px; padding: 15px 20px;
      background: var(--accent);
      border: 1.5px solid var(--accent); border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 16px; font-weight: 700; color: #1f1504; cursor: pointer;
      transition: transform 0.1s, background 0.25s, color 0.25s;
      box-shadow: 0 4px 16px rgba(255,205,110,0.25);
    }
    .pp-menge-toggle:active { transform: scale(0.98); }
    /* OPEN state: transparent, violet outline only */
    .pp-menge-toggle.open {
      background: transparent; color: var(--accent);
      border-radius: 14px 14px 0 0; margin-bottom: 0;
      box-shadow: none;
    }
    .pp-menge-arrow {
      font-size: 13px; transition: transform 0.3s ease;
      display: inline-block;
    }
    .pp-menge-toggle.open .pp-menge-arrow { transform: rotate(180deg); }

    .pp-variants {
      padding: 8px 16px 20px;
      display: none;
      animation: variantsFade 0.25s ease;
    }
    .pp-variants.open { display: block; }
    @keyframes variantsFade { from { opacity: 0; } to { opacity: 1; } }
    .pp-variants .variant-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .pp-vlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 4px 2px; }

    .variant {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 15px; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .variant:last-child { border-bottom: none; }
    .variant.req { background: rgba(255,205,110,0.04); }
    .v-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .v-qty { font-size: 16px; font-weight: 600; color: var(--text); }
    .v-price { font-size: 14px; font-weight: 600; color: var(--accent); }
    .v-price.req { color: var(--muted); font-style: italic; font-weight: 500; }
    .v-unit { font-size: 11px; color: var(--muted); font-weight: 400; }

    .v-add {
      background: var(--accent); color: #000; border: none; border-radius: 10px;
      padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 700; cursor: pointer; flex-shrink: 0; transition: transform 0.1s;
    }
    .v-add:active { transform: scale(0.9); }
    .v-stepper { display: none; align-items: center; gap: 12px; flex-shrink: 0; }
    .v-stepper.active { display: flex; }
    .v-sbtn {
      background: var(--surface2); border: 1px solid var(--accent); color: var(--accent);
      width: 30px; height: 30px; border-radius: 50%; font-size: 18px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .v-sbtn.plus { background: var(--accent); color: #000; border-color: var(--accent); }
    .v-snum { font-size: 15px; font-weight: 700; color: var(--accent); min-width: 20px; text-align: center; }

    /* CART DRAWER */

  function startMatrixSequence() {
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = "block";
    const chars = "アイウエオカキクケコ0123456789ABCDEFXYZ$#@%&";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    let running = true;
    function draw() {
      if (!running) return;
      ctx.fillStyle = "rgba(11,6,20,0.10)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#ffd455"; ctx.font = fontSize + "px monospace";
      for (let i=0;i<drops.length;i++){
        const ch = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    draw();
    setTimeout(() => { running = false; shatterScreen(canvas); }, 3000);
  }

  function shatterScreen(canvas) {
    const lockScreen = document.getElementById("lockScreen");
    const w = window.innerWidth, h = window.innerHeight;
    const snapshot = canvas.toDataURL();
    lockScreen.style.display = "none";
    const isMobile = w < 600;
    const cols = isMobile ? 5 : 8, rows = isMobile ? 9 : 13;
    const cellW = w/cols, cellH = h/rows;
    const container = document.createElement("div");
    container.style.cssText = "position:fixed;inset:0;z-index:700;pointer-events:none;overflow:hidden;";
    document.body.appendChild(container);
    const shards = [];
    for (let r=0;r<rows;r++){ for (let c=0;c<cols;c++){
      const s = document.createElement("div");
      s.style.cssText = `position:absolute;left:${c*cellW}px;top:${r*cellH}px;width:${cellW-4}px;height:${cellH-4}px;margin:2px;background-image:url(${snapshot});background-position:-${c*cellW}px -${r*cellH}px;background-size:${w}px ${h}px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.55),0 0 12px rgba(0,255,0,0.15),inset 0 0 8px rgba(0,255,0,0.1);transition:transform 2s cubic-bezier(0.25,0.1,0.25,1),opacity 2s ease;will-change:transform,opacity;`;
      container.appendChild(s);
      shards.push({el:s, cx:c*cellW+cellW/2, cy:r*cellH+cellH/2});
    }}
    canvas.style.display = "none";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const centerX=w/2, centerY=h/2;
      shards.forEach(s=>{
        const dx=s.cx-centerX, dy=s.cy-centerY;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const force=1.3+Math.random()*1.0;
        const x=(dx/dist)*dist*force+(Math.random()-0.5)*60;
        const y=(dy/dist)*dist*force+250+Math.random()*150;
        const rot=(Math.random()-0.5)*400;
        s.el.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(0.5)`;
        s.el.style.opacity="0";
      });
      setTimeout(()=>container.remove(),2100);
    }));
    setTimeout(()=>{
      const hdr=document.querySelector(".header-title");

  // ═══ STAR RENDER (precise per-star partial fill via SVG) ═══
  function starRow(s, size) {
    size = size || 15;
    const starPath = "M12 2l2.9 6.26L21.5 9l-5 4.6 1.4 6.9L12 17.3 6.1 20.5l1.4-6.9-5-4.6 6.6-.74z";
    let defs = "", stars = "";
    for (let i=0;i<5;i++){
      // fill fraction for THIS star: full if s>=i+1, partial if between, empty otherwise
      let frac = Math.max(0, Math.min(1, s - i)); // e.g. s=4.2 -> star5 gets 0.2
      const pct = (frac*100).toFixed(1);
      const gid = "sg" + Math.random().toString(36).slice(2,8) + i;
      defs += `<linearGradient id="${gid}"><stop offset="${pct}%" stop-color="var(--star)"/><stop offset="${pct}%" stop-color="transparent"/></linearGradient>`;

  // ═══ SOLD OUT PLACEHOLDER TILES (blurred, not clickable) ═══

  function openProduct(id) {

      <div class="pp-hero">

    document.getElementById("productPage").classList.add("open");
    // restore any existing cart quantities on the variant steppers
    p.variants.forEach(v => refreshVariant(v.key));
    // reset scroll positions: page to top, gallery to first video
    const pp = document.getElementById("productPage");
    pp.scrollTop = 0;
    const gal = pp.querySelector(".pp-gallery");

  function closeProduct() {
    document.getElementById("productPage").classList.remove("open");
    const gal = document.querySelector(".pp-gallery");
    if (gal) gal.onscroll = null;
    document.querySelectorAll(".pp-gvid").forEach(v => v.pause());
  }
  // Swipe horizontally to go back (works anywhere except on the horizontal media gallery)
  (function setupSwipeBack(){
    const pp = document.getElementById("productPage");
    let startX = 0, startY = 0, tracking = false, onGallery = false;
    pp.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      onGallery = !!e.target.closest(".pp-gallery");
      tracking = true;
    }, { passive: true });
    pp.addEventListener("touchmove", (e) => {
      if (!tracking || onGallery) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        pp.style.transform = `translateX(${Math.max(0, dx)}px)`;
        pp.style.transition = "none";
      }
    }, { passive: true });
    pp.addEventListener("touchend", (e) => {
      if (!tracking) return; tracking = false;
      pp.style.transition = "";
      pp.style.transform = "";
      if (onGallery) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        closeProduct();
      }
    }, { passive: true });
  })();
  let videoObserver = null;
  // Pause any video that isn't the mostly-visible one. Cheap, no reflow — safe to
  // call on every scroll tick so the old video stops the instant you swipe away.
  function pauseOffscreen() {
    const vids = document.querySelectorAll(".pp-gvid");
    const gal = document.querySelector(".pp-gallery");
    if (!vids.length || !gal) return;
    const galW = gal.clientWidth, scrollX = gal.scrollLeft;
    vids.forEach(v => {
      const left = v.offsetLeft - scrollX;
      const visW = Math.max(0, Math.min(left + v.offsetWidth, galW) - Math.max(left, 0));
      const ratio = v.offsetWidth ? visW / v.offsetWidth : 0;
      if (ratio < 0.6 && !v.paused) v.pause();
    });
  }
  function playOnlyVisible() {
    const vids = [...document.querySelectorAll(".pp-gvid")];
    const gal = document.querySelector(".pp-gallery");
    if (!vids.length || !gal) return;
    // Use scrollLeft + offsetWidth math instead of getBoundingClientRect on every
    // element — cheaper and doesn't force a full layout reflow.
    const galW = gal.clientWidth;
    const scrollX = gal.scrollLeft;
    let best = null, bestRatio = 0;
    vids.forEach(v => {
      const left = v.offsetLeft - scrollX;
      const right = left + v.offsetWidth;
      const visW = Math.max(0, Math.min(right, galW) - Math.max(left, 0));
      const ratio = v.offsetWidth ? visW / v.offsetWidth : 0;
      if (ratio > bestRatio) { bestRatio = ratio; best = v; }
    });
    vids.forEach(v => {
      if (v === best && bestRatio >= 0.6) {
        const pr = v.play(); if (pr && pr.catch) pr.catch(()=>{});
      } else {
        v.pause();
      }
    });
  }
  // During an active swipe we do NOTHING that touches layout — that was the
  // jitter. We only act 90ms AFTER scrolling stops (professional debounce).
  let galScrollTimer = null;
  function onGalleryScroll() {
    if (galScrollTimer) clearTimeout(galScrollTimer);
    galScrollTimer = setTimeout(() => {
      pauseOffscreen();
      playOnlyVisible();
    }, 90);
  }
  function setupVideoObserver() {
    const vids = document.querySelectorAll(".pp-gvid");
    if (!vids.length) return;
    if (videoObserver) videoObserver.disconnect();
    // Don't call load() (causes black re-flash). Just play the first one ASAP.
    const gal = document.querySelector(".pp-gallery");
    if (gal) {
      gal.onscroll = onGalleryScroll;  // debounced — fires after the swipe stops
    }
    // Play the first video immediately so it shows frames instead of black.
    const first = vids[0];
    if (first) {
      let kicks = 0;
      const kick = () => {
        // only if the user hasn't scrolled the gallery away from video 1
        if (gal && gal.scrollLeft > 40) { playOnlyVisible(); return; }
        const pr = first.play();
        if (pr && pr.catch) pr.catch(() => {
          // autoplay refused or not ready — retry a few times
          if (kicks++ < 8) setTimeout(kick, 250);
        });
      };
      kick();
      // fire on every readiness milestone (not once) so a slow load still starts
      first.addEventListener("canplay", kick);
      first.addEventListener("loadeddata", kick);
      first.addEventListener("canplaythrough", kick);
      // final safety nets for slow PC connections
      setTimeout(kick, 400);
      setTimeout(kick, 1000);
      setTimeout(kick, 2000);
    }
    // ensure only the visible one keeps playing
    setTimeout(playOnlyVisible, 200);
  }

  // If a CDN (jsDelivr) media URL fails, fall back to raw.githubusercontent once.
  function cdnFallback(el) {
    if (el.dataset.fellback) return;
    el.dataset.fellback = "1";
    const src = el.getAttribute("src") || "";
    if (src.indexOf("cdn.jsdelivr.net/gh/") !== -1) {
      const raw = src
        .replace("https://cdn.jsdelivr.net/gh/", "https://raw.githubusercontent.com/")
        .replace("@main/", "/main/");
      el.setAttribute("src", raw);
      if (el.tagName === "VIDEO") { try { el.load(); el.play().catch(()=>{}); } catch(e){} }
    }
  }

  // Image load failed — retry rather than hide, so a collage cell is never blank.
  // Stage 1: switch jsDelivr -> raw.githubusercontent. Stage 2: cache-bust retry.
  // Only after both fail do we hide it (very rare).
  function imgFallback(el) {
    const stage = parseInt(el.dataset.imgStage || "0", 10);
    const cur = el.getAttribute("src") || "";
    if (stage === 0) {
      el.dataset.imgStage = "1";
      if (cur.indexOf("cdn.jsdelivr.net/gh/") !== -1) {
        el.src = cur
          .replace("https://cdn.jsdelivr.net/gh/", "https://raw.githubusercontent.com/")
          .replace("@main/", "/main/");
      } else {
        // already raw — just cache-bust
        el.src = cur.split("?")[0] + "?r=" + Date.now();
      }
      return;
    }
    if (stage === 1) {
      el.dataset.imgStage = "2";
      // final retry with a cache-buster on whatever host we're on
      el.src = cur.split("?")[0] + "?r=" + Date.now();
      return;
    }
    // both retries failed — keep the cell shape, just show the placeholder bg
    el.style.visibility = "hidden";
  }

  // Preload all product videos quietly in the background after unlock,
  // so they're cached by the time the user opens a hash product (no black screen).
  function toggleVid(v) {
    // Only the video that's mostly in view responds to taps — ignore the
    // half-visible neighbours peeking in from the sides.
    const gal = document.querySelector(".pp-gallery");
    if (gal) {
      const left = v.offsetLeft - gal.scrollLeft;
      const right = left + v.offsetWidth;
      const visW = Math.max(0, Math.min(right, gal.clientWidth) - Math.max(left, 0));
      const ratio = v.offsetWidth ? visW / v.offsetWidth : 0;
      if (ratio < 0.6) return; // not the centered one — ignore the tap
    }
    if (v.paused) v.play(); else v.pause();
  }
  function toggleMenge() {
    const v = document.getElementById("ppVariants");
    const t = document.getElementById("mengeToggle");
    const label = document.getElementById("mengeLabel");
    const pp = document.getElementById("productPage");
    const isOpen = t.classList.contains("open");
    if (!isOpen) {
      // OPEN: show instantly (no lag), then smooth-scroll it into view
      v.classList.add("open");
      t.classList.add("open");
      label.textContent = "Schließen";
      requestAnimationFrame(() => {
        const tRect = t.getBoundingClientRect();
        const ppRect = pp.getBoundingClientRect();
        const toggleOffset = pp.scrollTop + tRect.top - ppRect.top;
        const target = toggleOffset - pp.clientHeight * 0.30;
        pp.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
      });
    } else {
      // CLOSE: scroll up first; only hide once we're back near the top (prevents jump)
      t.classList.remove("open");
      label.textContent = "Menge wählen";
      pp.scrollTo({ top: 0, behavior: "smooth" });
      const hideWhenTop = () => {
        if (pp.scrollTop <= 4) {
          v.classList.remove("open");
        } else {
          requestAnimationFrame(hideWhenTop);
        }
      };
      requestAnimationFrame(hideWhenTop);
    }
  }

  // ═══ CART LOGIC ═══
  function addVariant(key) {
    cart[key] = (cart[key] || 0) + 1;
    refreshVariant(key); updateCartUI(); refreshCartDrawer();
  }
  function changeVariant(key, delta) {
    cart[key] = Math.max(0, (cart[key] || 0) + delta);
    if (cart[key] === 0) delete cart[key];
    refreshVariant(key); updateCartUI(); refreshCartDrawer();
  }
  // Empty the whole cart — first tap asks, second tap clears
  let clearArmed = false, clearTimer = null;
  function clearCart() {
    const btn = document.getElementById("clearCartBtn");
    if (!clearArmed) {
      clearArmed = true;
      btn.textContent = "Wirklich leeren?";
      btn.classList.add("confirm");
      clearTimer = setTimeout(resetClearBtn, 3000);
      return;
    }
    clearTimeout(clearTimer);
    resetClearBtn();
    // clear every entry, refresh the product page steppers too
    Object.keys(cart).forEach(key => { delete cart[key]; refreshVariant(key); });
    updateCartUI();
    renderCartItems();
  }
  function resetClearBtn() {
    const btn = document.getElementById("clearCartBtn");
    clearArmed = false;
    if (btn) { btn.textContent = "Leeren"; btn.classList.remove("confirm"); }
  }

  // Re-render the open cart drawer so items, quantities and total stay in sync
  function refreshCartDrawer() {
    const drawer = document.getElementById("drawer");
    if (drawer && drawer.classList.contains("open")) renderCartItems();
  }
  function refreshVariant(key) {
    const addBtn = document.getElementById(`add-${key}`);
    const step = document.getElementById(`step-${key}`);
    const num = document.getElementById(`num-${key}`);
    if (!addBtn || !step) return; // product page not open
    const qty = cart[key] || 0;
    if (qty > 0) { addBtn.style.display = "none"; step.classList.add("active"); if (num) num.textContent = qty; }
    else { addBtn.style.display = "block"; step.classList.remove("active"); }
  }

  function cartTotals() {
    let count = 0, total = 0, hasReq = false;
    for (const key in cart) {
      const found = findVariant(key); if (!found) continue;
      const qty = cart[key];
      count += qty;
      if (found.variant.price === 0) hasReq = true;
      else total += lineTotalOf(found.variant, qty);
    }
    return { count, total, hasReq };
  }

  function updateCartUI() {
    const { count, total } = cartTotals();
    const badge = document.getElementById("cartBadge");
    badge.textContent = count; badge.classList.toggle("show", count > 0);
    const fc = document.getElementById("floatingCart");
    document.getElementById("fcCount").textContent = count;
    document.getElementById("fcTotal").textContent = `${CURRENCY} ${fmtPrice(total)}`;
    fc.classList.toggle("show", count > 0);
    // product page cart badge
    const ppBadge = document.getElementById("ppCartBadge");
    if (ppBadge) { ppBadge.textContent = count; ppBadge.classList.toggle("show", count > 0); }
  }

  function openCart() {
    renderCartItems();
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawerOverlay").classList.add("open");
    document.getElementById("floatingCart").classList.remove("show");
  }
  function closeCart() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("open");
    updateCartUI();
  }

  function renderCartItems() {
    const container = document.getElementById("cartItems");
    const footer = document.getElementById("cartFooter");
    const keys = Object.keys(cart).filter(k => cart[k] > 0);
    const clearBtn = document.getElementById("clearCartBtn");
    if (keys.length === 0) {
      container.innerHTML = `<div class="empty-cart"><div class="empty-cart-icon">🛒</div>Ihr Warenkorb ist leer</div>`;
      footer.style.display = "none";
      if (clearBtn) { clearBtn.style.display = "none"; resetClearBtn(); }
      return;
    }
    if (clearBtn) clearBtn.style.display = "block";
    container.innerHTML = keys.map(key => {
      const { product, variant } = findVariant(key);
      const qty = cart[key];
      const isReq = variant.price === 0;
      const lineTotal = lineTotalOf(variant, qty);
      const priceText = isReq
        ? `<div class="cart-item-price req">Preis Anfrage</div>`
        : `<div class="cart-item-price">${CURRENCY} ${fmtPrice(lineTotal)}${variant.per ? ` (${CURRENCY} ${fmtPrice(variant.price)}/Stk)` : ''}</div>`;
      return `<div class="cart-item">
        <div class="cart-item-emoji">${product.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${product.name} · ${variant.label}</div>
          ${priceText}
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeVariant('${key}',-1)">−</button>
          <div class="qty-num">${qty}</div>
          <button class="qty-btn" onclick="changeVariant('${key}',1)">+</button>
        </div>
      </div>`;
    }).join("");
    const { total, hasReq } = cartTotals();
    document.getElementById("cartTotal").textContent = `${CURRENCY} ${fmtPrice(total)}`;
    document.getElementById("reqNote").style.display = hasReq ? "block" : "none";
    footer.style.display = "block";
  }

  // ═══ SUBMIT ORDER ═══
  // Zeigt oben im Shop die letzte Bestellung mit "Nochmal bestellen"-Button.
  // Verfällt automatisch nach 14 Tagen Inaktivität.
  const LAST_ORDER_MAX_AGE = 14 * 24 * 60 * 60 * 1000; // 2 Wochen in ms
  function applyLastOrder(raw) {
    const banner = document.getElementById("lastOrderBanner");
    if (!banner) return;
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    // Gültigkeit prüfen: vorhanden, hat Zeitstempel, nicht älter als 14 Tage
    if (!data || !data.ts || !data.cart || (Date.now() - data.ts) > LAST_ORDER_MAX_AGE) {
      banner.style.display = "none";
      // abgelaufene Bestellung aufräumen
      try {
        if (tg && tg.CloudStorage && tg.CloudStorage.removeItem) tg.CloudStorage.removeItem("last_order");
        else localStorage.removeItem("blocktheke_last_order");
      } catch (e) {}
      return;
    }
    // Zusammenfassung der letzten Bestellung bauen
    const parts = [];
    Object.keys(data.cart).forEach(key => {
      const qty = data.cart[key];
      if (qty > 0) {
        const fv = findVariant(key);
        if (fv && fv.product && fv.variant) {
          parts.push(`${qty}× ${fv.product.name} · ${fv.variant.label}`);
        }
      }
    });
    if (parts.length === 0) { banner.style.display = "none"; return; }
    banner.innerHTML =
      `<div class="lo-card">
         <div class="lo-top">
           <span class="lo-label">🕐 Deine letzte Bestellung</span>
           <button class="lo-close" id="loCloseBtn" aria-label="Ausblenden">✕</button>
         </div>
         <div class="lo-items">${parts.join(" · ")}</div>
         <button class="lo-btn" id="reorderBtn">🛒 Nochmal bestellen</button>
       </div>`;
    banner.style.display = "block";
    // X: Banner ausblenden und gespeicherte Bestellung löschen
    document.getElementById("loCloseBtn").onclick = () => {
      banner.style.display = "none";
      try {
        if (tg && tg.CloudStorage && tg.CloudStorage.removeItem) tg.CloudStorage.removeItem("last_order");
        else localStorage.removeItem("blocktheke_last_order");
      } catch (e) {}
    };
    document.getElementById("reorderBtn").onclick = () => {
      // letzte Bestellung in den Warenkorb laden
      Object.keys(data.cart).forEach(key => {
        if (data.cart[key] > 0) cart[key] = data.cart[key];
      });
      updateCartUI();
      openCart();
    };
  }
  function showLastOrder() {
    try {
      if (tg && tg.CloudStorage && tg.CloudStorage.getItem) {
        tg.CloudStorage.getItem("last_order", (err, val) => { applyLastOrder(err ? null : val); });
      } else {
        applyLastOrder(localStorage.getItem("blocktheke_last_order"));
      }
    } catch (e) { /* Speicher blockiert — Banner bleibt aus */ }
  }

  function submitOrder() {
    const keys = Object.keys(cart).filter(k => cart[k] > 0);
    if (keys.length === 0) return;

    let lines = [], total = 0, reqItems = [];
    keys.forEach(key => {
      const { product, variant } = findVariant(key);
      const qty = cart[key];
      if (variant.price === 0) {
        lines.push(`- ${qty}x ${product.name} · ${variant.label} — (Preis Anfrage)`);
        reqItems.push(`${variant.label} ${product.name}`);
      } else {
        const lineTotal = lineTotalOf(variant, qty);
        total += lineTotal;
        const per = variant.per ? ` (${CURRENCY} ${fmtPrice(variant.price)}/Stk)` : "";
        lines.push(`- ${qty}x ${product.name} · ${variant.label} — ${CURRENCY} ${fmtPrice(lineTotal)}${per}`);
      }
    });

    const note = document.getElementById("orderNote").value.trim();
    let msg = `Ich würde gerne folgendes bestellen:\n\n${lines.join("\n")}\n\nTotal: ${CURRENCY} ${fmtPrice(total)}`;
    if (reqItems.length > 0) {
      msg += `\n(+ Preis Anfrage auf ${reqItems.join(", ")})`;
    }
    if (note) msg += `\n\nNotiz: ${note}`;

    const deepLink = `https://t.me/${OWNER_USERNAME}?text=${encodeURIComponent(msg)}`;

    // Letzte Bestellung merken (für "Nochmal bestellen" oben im Shop).
    // Telegram CloudStorage = zuverlässig & geräteübergreifend. Mit Zeitstempel,
    // damit sie nach 2 Wochen Inaktivität automatisch verfällt.
    try {
      const payload = JSON.stringify({ cart: { ...cart }, ts: Date.now() });
      if (tg && tg.CloudStorage && tg.CloudStorage.setItem) {
        tg.CloudStorage.setItem("last_order", payload);
      } else {
        localStorage.setItem("blocktheke_last_order", payload); // Fallback
      }
    } catch (e) { /* Speicher evtl. blockiert — ignorieren */ }

    if (tg) { tg.openTelegramLink(deepLink); setTimeout(()=>tg.close(),500); }
    else { window.open(deepLink, "_blank"); }
  }
</script>
</body>
</html>
